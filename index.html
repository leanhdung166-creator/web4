<!DOCTYPE html>
<html lang="vi">

  <title>Web4 - Mẫu thiết kế</title>

    <p>Đây là website được xây dựng dựa trên bài thực hành 04.

  </main>

  <footer>
    <p>&copy; 2025 - Web4 Demo</p>
