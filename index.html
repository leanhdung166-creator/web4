<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web4 - Mẫu Thiết Kế</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Logo">
    </div>
    <nav class="main-nav">
      <a href="#news">TIN TỨC</a>
      <a href="#review">ĐÁNH GIÁ</a>
      <a href="#community">CỘNG ĐỒNG</a>
      <a href="#cosplay">COSPLAY</a>
      <a href="#giftcode">GIFT CODE</a>
      <a href="#movies">PHIM ẢNH</a>
    </nav>
    <div class="search-box">
      <input type="text" placeholder="Tìm kiếm...">
    </div>
  </header>

  <!-- Sub Menu -->
  <div class="sub-menu">
    <div class="links">
      <a href="#game-online">GAME ONLINE</a>
      <a href="#pc-console">PC/CONSOLE</a>
      <a href="#game-mobile">GAME MOBILE</a>
      <a href="#esports">ESPORTS</a>
      <a href="#tech">CÔNG NGHỆ</a>
    </div>
    <div class="socials">
      <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
      <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
    </div>
  </div>

  <!-- Banner -->
  <section class="banner">
    <img src="images/banner.png" alt="Banner">
  </section>

  <!-- Nội dung -->
  <main>
    <section id="news" class="content-section">
      <h2>Tin tức</h2>
      <div class="posts">
        <article>
          <img src="images/post1.jpg" alt="Bài viết 1">
          <h3>Tiêu đề bài viết 1</h3>
        </article>
        <article>
          <img src="images/post2.jpg" alt="Bài viết 2">
          <h3>Tiêu đề bài viết 2</h3>
        </article>
        <article>
          <img src="images/post3.jpg" alt="Bài viết 3">
          <h3>Tiêu đề bài viết 3</h3>
        </article>
      </div>
    </section>

    <section id="review" class="content-section">
      <h2>Đánh giá</h2>
      <div class="posts">
        <article>
          <img src="images/post4.jpg" alt="Bài viết 4">
          <h3>Tiêu đề bài viết 4</h3>
        </article>
        <article>
          <img src="images/post5.jpg" alt="Bài viết 5">
          <h3>Tiêu đề bài viết 5</h3>
        </article>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Web4. All rights reserved.</p>
  </footer>
</body>
</html>
